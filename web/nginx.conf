server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Проксируем API на gateway — фронтенд ходит на тот же origin, CORS не нужен.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: любые маршруты отдаём index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
