# КИЦУНЭ — статика + проксирование /api на api-gateway.
#
# HTTPS: в проде терминируйте TLS здесь же. Раскомментируйте блок server (443)
# ниже, смонтируйте сертификат/ключ в контейнер (volumes: ./certs:/etc/nginx/certs)
# и пробросьте порт 443. Для локали можно self-signed:
#   openssl req -x509 -newkey rsa:2048 -nodes -days 365 \
#     -keyout certs/kitsune.key -out certs/kitsune.crt -subj "/CN=localhost"
# После включения TLS снимите комментарий со Strict-Transport-Security.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Заголовки безопасности (применяются и к статике, и к ошибкам) ---
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # только под HTTPS

    # Проксируем API на gateway. Резолвер Docker (127.0.0.11) + переменный
    # upstream заставляют nginx резолвить имя на каждый запрос — иначе после
    # пересборки api-gateway nginx держит старый IP и отдаёт 502.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $gateway api-gateway;
        proxy_pass http://$gateway:8080$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Прокидываем реальный IP клиента — на нём шлюз строит rate-limit.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA: любые маршруты отдаём index.html (клиентский роутинг).
    location / {
        try_files $uri $uri/ /index.html;
    }
}

