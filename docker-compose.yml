services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: tea_platform
      POSTGRES_USER: dev
      POSTGRES_PASSWORD: dev
    ports:
      # На хосте порт 5432 часто занят локальным Postgres — публикуем на 5433.
      # Сервисы внутри сети ходят на postgres:5432 как обычно.
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev -d tea_platform"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tea-network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - tea-network

  redis:
    image: redis:7-alpine
    container_name: redis
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tea-network

  catalog-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: catalog-svc
    container_name: catalog-svc
    environment:
      GRPC_PORT: "9090"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: tea_platform
      REDIS_ADDR: redis:6379
    ports:
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

  account-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: account-svc
    container_name: account-svc
    environment:
      GRPC_PORT: "9094"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: tea_platform
      REDIS_ADDR: redis:6379
    ports:
      - "9094:9094"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

  cart-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: cart-svc
    container_name: cart-svc
    environment:
      GRPC_PORT: "9091"
      CATALOG_ADDR: catalog-svc:9090
      REDIS_ADDR: redis:6379
    ports:
      - "9091:9091"
    depends_on:
      redis:
        condition: service_healthy
      catalog-svc:
        condition: service_started
    restart: unless-stopped
    networks:
      - tea-network

  order-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: order-svc
    container_name: order-svc
    environment:
      GRPC_PORT: "9092"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: tea_platform
      KAFKA_BROKERS: kafka:9092
      CART_ADDR: cart-svc:9091
    ports:
      # На хосте 9092 занят Kafka — публикуем order-svc на 9095.
      - "9095:9092"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      cart-svc:
        condition: service_started
    restart: unless-stopped
    networks:
      - tea-network

  delivery-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: delivery-svc
    container_name: delivery-svc
    environment:
      GRPC_PORT: "9093"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: tea_platform
      KAFKA_BROKERS: kafka:9092
      ORDER_ADDR: order-svc:9092
    ports:
      - "9093:9093"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-svc:
        condition: service_started
    restart: unless-stopped
    networks:
      - tea-network

  api-gateway:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: api-gateway
    container_name: api-gateway
    environment:
      APP_PORT: "8080"
      CATALOG_ADDR: catalog-svc:9090
      CART_ADDR: cart-svc:9091
      ORDER_ADDR: order-svc:9092
      DELIVERY_ADDR: delivery-svc:9093
      ACCOUNT_ADDR: account-svc:9094
      KAFKA_BROKERS: kafka:9092
    ports:
      - "8080:8080"
    depends_on:
      catalog-svc:
        condition: service_started
      cart-svc:
        condition: service_started
      order-svc:
        condition: service_started
      delivery-svc:
        condition: service_started
      account-svc:
        condition: service_started
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

  inventory-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: inventory-svc
    container_name: inventory-svc
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: tea_platform
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

  payment-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: payment-svc
    container_name: payment-svc
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: dev
      DB_PASSWORD: dev
      DB_NAME: tea_platform
      KAFKA_BROKERS: kafka:9092
      ORDER_ADDR: order-svc:9092
      PAYMENT_LIMIT_CENTS: "1000000" # 10 000 ₽ — заказы дороже отклоняются (демо компенсации)
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      order-svc:
        condition: service_started
    restart: unless-stopped
    networks:
      - tea-network

  notification-svc:
    build:
      context: .
      dockerfile: dockerfile
      args:
        SERVICE: notification-svc
    container_name: notification-svc
    environment:
      KAFKA_BROKERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

  # ── Наблюдаемость ──
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9099:9090" # на хосте 9090 занят catalog-svc
    restart: unless-stopped
    networks:
      - tea-network

  grafana:
    image: grafana/grafana:11.2.0
    container_name: grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - tea-network

  # ── Frontend (React SPA + nginx) ──
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: web
    ports:
      - "8081:80"
    depends_on:
      - api-gateway
    restart: unless-stopped
    networks:
      - tea-network

  # ── Централизованные логи (ELK) ──
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - es_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
    networks:
      - tea-network

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: filebeat
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./docker/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - tea-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  es_data:

networks:
  tea-network:
    driver: bridge