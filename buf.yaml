version: v2
modules:
  - path: proto
lint:
  use:
    - STANDARD
  except:
    # Осознанно переиспользуем общие сообщения как запрос/ответ нескольких RPC
    # (Cart — ответ корзины; SessionRequest — токен для GetSession/Logout).
    - RPC_RESPONSE_STANDARD_NAME
    - RPC_REQUEST_STANDARD_NAME
    - RPC_REQUEST_RESPONSE_UNIQUE
breaking:
  use:
    - FILE
