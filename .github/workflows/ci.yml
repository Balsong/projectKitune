name: CI

on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

# Отменяем устаревшие прогоны при новом пуше в ту же ветку/PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.25"

jobs:
  # ── Качество кода: форматирование, vet, статический анализ ──
  lint:
    name: Lint & Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "❌ Файлы не отформатированы gofmt:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ gofmt: всё чисто"

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest

  # ── Тесты с race-детектором и покрытием ──
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  # ── Сборка всех сервисов ──
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: go build
        run: go build -v ./...

  # ── Сборка Docker-образов сервисов ──
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [build]
    strategy:
      matrix:
        service: [api-gateway, catalog-svc, account-svc, cart-svc, order-svc, inventory-svc, payment-svc, delivery-svc, notification-svc, booking-svc]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          build-args: |
            SERVICE=${{ matrix.service }}
          push: false
          tags: tea-platform/${{ matrix.service }}:ci
